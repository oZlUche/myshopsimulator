name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.7-stable
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}_linux.x86_64" godot
      - name: Import project
        run: ./godot --headless --path . --import || true
      - name: Run tests (core + save fixtures)
        run: ./godot --headless --path . --script res://tests/run_tests.gd
      - name: UI smoke test (scripted playthrough of one period)
        run: |
          ./godot --headless --path . --script res://tests/tools/ui_smoke.gd 2>&1 | tee ui.log
          grep -q "UI_SMOKE PASS" ui.log
          ! grep -q "SCRIPT ERROR" ui.log
      - name: Art showcase (draws every sprite and equipment once)
        run: |
          ./godot --headless --path . --script res://tests/tools/art_showcase.gd 2>&1 | tee art.log
          grep -q "ART_SHOWCASE PASS" art.log
          ! grep -q "SCRIPT ERROR" art.log
